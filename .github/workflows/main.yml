name: Build & verify

on:
  push:
    branches: [main, v2-overhaul]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test & build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Only the tagged-release step needs write; nothing needs the rest.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Don't leave the job token usable by later steps.
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        # `flutter analyze` treats infos as fatal by default, so bare
        # --fatal-warnings failed the job on info-level lints. `dart fix`
        # cleared all but four Flutter API deprecations (Radio groupValue,
        # TickerMode.of), which need refactors, not a red build.
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Read pubspec version
        id: ver
        run: |
          version=$(awk -F'[:+]' '/^version:/{gsub(/ /,"",$2); print $2}' pubspec.yaml)
          code=$(awk -F'[:+]' '/^version:/{gsub(/ /,"",$3); print $3}' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Detected version=${version} code=${code}"

      # ---------------------------------------------------------------- signing
      - name: Decode release keystore
        id: key
        # Never materialise signing material on a pull_request run. GitHub
        # already withholds secrets from fork PRs, but this repo is public
        # and a same-repo PR branch would otherwise get the keystore and
        # passwords on disk. PRs fall through to the debug-key build below.
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret — will produce a debug-key-signed fallback artifact."
            exit 0
          fi
          keystore="$RUNNER_TEMP/kratomtracker-plus.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          props="$RUNNER_TEMP/key.properties"
          {
            echo "keystore=$keystore"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          } > "$props"
          echo "properties=$props" >> "$GITHUB_OUTPUT"
          echo "have_key=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK (signed)
        if: steps.key.outputs.have_key == 'true'
        env:
          KRATOM_KEYSTORE_PROPERTIES: ${{ steps.key.outputs.properties }}
        run: flutter build apk --release

      - name: Build APK (unsigned, debug-key fallback)
        if: steps.key.outputs.have_key != 'true'
        run: |
          echo "::warning::No signing secrets present — building a debug-key-signed artifact, NOT a real release."
          flutter build apk --debug
          # Rename so nobody mistakes it for a release build.
          cd build/app/outputs/flutter-apk
          mv app-debug.apk "kratom-tracker-v${{ steps.ver.outputs.version }}-unsigned-debugkey.apk"

      - name: Stage release artifact name
        if: steps.key.outputs.have_key == 'true'
        run: |
          cd build/app/outputs/flutter-apk
          cp app-release.apk "kratom-tracker-v${{ steps.ver.outputs.version }}-release.apk"

      - name: Cleanup keystore material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/kratomtracker-plus.jks" "$RUNNER_TEMP/key.properties" 2>/dev/null || true

      # --------------------------------------------------------------- artifacts
      - name: Upload signed release APK
        if: steps.key.outputs.have_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kratom-tracker-v${{ steps.ver.outputs.version }}-release-apk
          path: build/app/outputs/flutter-apk/kratom-tracker-v${{ steps.ver.outputs.version }}-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload unsigned-debugkey APK
        if: steps.key.outputs.have_key != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kratom-tracker-v${{ steps.ver.outputs.version }}-unsigned-debugkey-apk
          path: |
            build/app/outputs/flutter-apk/kratom-tracker-v${{ steps.ver.outputs.version }}-unsigned-debugkey.apk
            build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: warn

      # --------------------------------------------------------------- releases
      - name: Attach APK to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.have_key == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/kratom-tracker-v${{ steps.ver.outputs.version }}-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
